# ====================================================================
# CONFIGURAÇÃO DE TESTE - BANCO DE DADOS H2 COMPATÍVEL COM POSTGRESQL
# ====================================================================
spring.application.name=projeto-ads-p4-api-test
server.port=0

# H2 em modo PostgreSQL para testes unitários e de integração
spring.datasource.url=jdbc:h2:mem:orientatestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate cria e limpa o schema automaticamente para testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway desabilitado em testes isolados com H2
spring.flyway.enabled=false

# Desabilitar envio de e-mails reais em testes
spring.mail.host=localhost
spring.mail.port=1025

# Jackson
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
