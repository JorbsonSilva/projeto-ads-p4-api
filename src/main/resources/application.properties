# ====================================================================
# CONFIGURAÇÃO DE AMBIENTE - API ORIENTA (P4)
# Padrão: 12-Factor App & Variáveis de Ambiente (DT-001, DT-006, DT-007)
# ====================================================================
spring.application.name=projeto-ads-p4-api
server.port=${PORT:8080}

# --------------------------------------------------------------------
# Banco de Dados (PostgreSQL)
# Padrão local aponta para o container do docker-compose
# --------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orientadb}
spring.datasource.username=${DB_USER:orienta_user}
spring.datasource.password=${DB_PASSWORD:orienta_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate para garantir que Flyway seja o dono do schema (DT-006)
# --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --------------------------------------------------------------------
# Migrations Versionadas (Flyway)
# --------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# --------------------------------------------------------------------
# Serviço de E-mail (Mailpit Local a Custo Zero)
# Interface Web disponível em http://localhost:8025
# --------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# --------------------------------------------------------------------
# Swagger / OpenAPI 3.0 (Contrato Vivo da API)
# --------------------------------------------------------------------
springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --------------------------------------------------------------------
# Serialização JSON e Fuso Horário (DT-013)
# --------------------------------------------------------------------
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false

# --------------------------------------------------------------------
# CORS por Ambiente (Fase 2 - f2-t5)
# --------------------------------------------------------------------
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:19006,exp://*}

# --------------------------------------------------------------------
# Logging e Proteção de Dados Sensíveis (Fase 2 - f2-t6)
# Mascara parâmetros SQL e impede vazamento de senhas em logs de debug
# --------------------------------------------------------------------
logging.level.com.equipe.projetoadsapi=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

